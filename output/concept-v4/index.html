<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese · Play</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#d8d7bd url("assets/jade-valley.png") center/cover fixed}
/* Keep the layout at iPhone 14 Pro CSS dimensions, including on desktop. */
.phone{position:absolute;left:50%;top:50%;width:393px;height:852px;transform:translate(-50%,-50%) scale(var(--phone-scale,0));transform-origin:center;overflow:hidden;box-shadow:0 0 60px #12392d50;background:#eee6cf}
iframe{display:block;width:393px;height:852px;border:0}
.guide{position:fixed;bottom:20px;right:24px;padding:8px 14px;background:#fff3daee;border:1px solid #b9a268;border-radius:9px;color:#284d38;font:14px Georgia;text-decoration:none}
@media(max-width:760px){.guide{display:none}}
</style>
</head>
<body>
<div class="phone"><iframe src="screens/home.html" title="Chinese game"></iframe></div>
<a class="guide" href="document.html">Game guide</a>
<script>
const phone=document.querySelector('.phone');
function fitPhone(){
 const viewport=window.visualViewport;
 const width=Math.min(window.innerWidth,viewport?.width??window.innerWidth);
 const height=Math.min(window.innerHeight,viewport?.height??window.innerHeight);
 phone.style.setProperty('--phone-scale',Math.min(1,width/393,height/852));
 phone.style.left=((viewport?.offsetLeft??0)+width/2)+'px';
 phone.style.top=((viewport?.offsetTop??0)+height/2)+'px';
}
fitPhone();
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)document.querySelector('iframe').contentWindow.postMessage('debug-space',location.origin)}});
window.addEventListener('resize',fitPhone);
window.visualViewport?.addEventListener('resize',fitPhone);
window.visualViewport?.addEventListener('scroll',fitPhone);
</script>
</body>
</html>
